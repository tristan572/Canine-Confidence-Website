<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Canine Confidence Cartoon</title>
<style>
  @font-face { font-family: 'Luckiest Guy'; src: url(fonts/luckiestguy.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; src: url(fonts/baloo2.woff2) format('woff2'); font-weight: 400 800; }
  :root { --ink: #1F2036; --sky: #2BA6DE; --amber: #E8A33A; --clarity: #6C5FD3; --indigo: #26275F; --green: #3DAA78; --cream: #FBF4E6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  body { font-family: 'Baloo 2', sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .scene { position: absolute; inset: 0; display: none; }
  .scene > svg { position: absolute; inset: 0; }
  .txt { position: absolute; left: 60px; right: 60px; text-align: center; filter: url(#boilText); }
  .toon { font-family: 'Luckiest Guy', sans-serif; color: #fff; -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill;
          text-shadow: 0 10px 0 var(--ink); letter-spacing: .02em; line-height: 1.02; text-transform: uppercase; }
  .w { display: inline-block; }
  .body { font-weight: 800; font-size: 50px; line-height: 1.22; color: var(--ink); }
  .card { position: absolute; left: 70px; right: 70px; background: #fff; border: 7px solid var(--ink); border-radius: 36px 44px 32px 40px;
          box-shadow: 10px 12px 0 var(--ink); padding: 34px 44px; text-align: center; }
  .card h3 { font-family: 'Luckiest Guy'; font-weight: 400; text-transform: uppercase; font-size: 64px; line-height: 1.05; letter-spacing: .02em; }
  .card p { font-weight: 700; font-size: 44px; line-height: 1.25; margin-top: 12px; color: #3B3C5C; }
  .chip { display: inline-block; font-family: 'Luckiest Guy'; font-size: 44px; color: #fff; padding: 12px 34px 4px; border: 6px solid var(--ink);
          border-radius: 999px; box-shadow: 6px 7px 0 var(--ink); letter-spacing: .08em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="#1F2036" stroke-width="4" opacity=".35"/></pattern>
    <filter id="boil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="boilText" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="boilNoiseT" type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="1"/><feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.12  0 0 0 0 0.2  0 0 0 .09 0"/></filter>
  </defs>
</svg>
<div id="stage"></div>

<script src="dog.js"></script>
<script>
useLook('cleoHero'); // Cleo, the Canine Confidence mascot
const W = 1080, H = 1920;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const p = (t, s, d) => clamp((t - s) / d);
const pop = (t, s, d = .45) => back(p(t, s, d));
const E = id => document.getElementById(id);
const stage = E('stage');

// ---------- Doodle helpers ----------
const ink = `stroke="#1F2036" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"`;
const bg = (color, doodles = '') => `<rect width="${W}" height="${H}" fill="${color}"/>${doodles}<rect width="${W}" height="${H}" filter="url(#paper)"/>`;
const star = (x, y, r, fill = '#F2B33D', id = '') => {
  let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ',' + (y + Math.sin(a) * rr).toFixed(1); }
  return `<path ${id ? `id="${id}"` : ''} d="${d}Z" fill="${fill}" ${ink} stroke-width="6"/>`;
};
const sparkle = (x, y, r, id = '') => `<path ${id ? `id="${id}"` : ''} d="M${x},${y - r} Q${x + r * .15},${y - r * .15} ${x + r},${y} Q${x + r * .15},${y + r * .15} ${x},${y + r} Q${x - r * .15},${y + r * .15} ${x - r},${y} Q${x - r * .15},${y - r * .15} ${x},${y - r}Z" fill="#fff" ${ink} stroke-width="5"/>`;
const heart = (x, y, s, fill = '#F25C7A', id = '') => `<g ${id ? `id="${id}"` : ''} transform="translate(${x} ${y}) scale(${s})"><path d="M0,30 C-40,0 -60,-30 -35,-50 C-18,-62 -4,-52 0,-38 C4,-52 18,-62 35,-50 C60,-30 40,0 0,30 Z" fill="${fill}" ${ink}/></g>`;
const bgDots = (c) => { let s = ''; const pts = [[90, 180], [980, 260], [140, 1500], [960, 1400], [80, 900], [1000, 820], [520, 110], [1010, 1880], [200, 1840]]; pts.forEach(([x, y], i) => s += i % 2 ? sparkle(x, y, 22).replace('fill="#fff"', `fill="${c}"`) : `<circle cx="${x}" cy="${y}" r="10" fill="${c}"/>`); return s; };
function words(text, cls = '') { return text.split(' ').map(w => `<span class="w ${cls}">${w}</span>`).join(' '); }
function animWords(el, t, s, stagger = .08) {
  [...el.querySelectorAll('.w')].forEach((w, i) => {
    const k = pop(t, s + i * stagger, .4);
    w.style.opacity = clamp(p(t, s + i * stagger, .12));
    w.style.transform = `scale(${k.toFixed(3)}) rotate(${((1 - clamp(k)) * (i % 2 ? 12 : -12)).toFixed(2)}deg)`;
  });
}
function popEl(el, t, s, d = .45, rot0 = 0) {
  const k = pop(t, s, d);
  el.style.opacity = clamp(p(t, s, .1));
  el.style.transform = `${el.dataset.base || ''} scale(${k.toFixed(3)}) rotate(${(rot0 * (1 - clamp(k))).toFixed(2)}deg)`;
}
function popSvg(el, t, s, cx, cy, d = .45, extra = '') {
  const k = pop(t, s, d);
  el.setAttribute('opacity', clamp(p(t, s, .1)));
  el.setAttribute('transform', `translate(${cx} ${cy}) scale(${k.toFixed(3)}) translate(${-cx} ${-cy}) ${extra}`);
}
function slideUp(el, t, s, d = .5, dist = 80) {
  const k = easeOut(p(t, s, d));
  el.style.opacity = k;
  el.style.transform = `translateY(${((1 - k) * dist).toFixed(1)}px)`;
}

// ---------- Scenes ----------
const scenes = [];
function scene(id, dur, html, update, color) {
  const el = document.createElement('section');
  el.className = 'scene'; el.id = id; el.innerHTML = html;
  stage.appendChild(el);
  scenes.push({ id, dur, el, update, color });
}
const BLOCK_COL = { health: '#2BA6DE', lifestyle: '#E8A33A', clarity: '#6C5FD3', skills: '#3DAA78' };

// S1 hook: confused staffy
scene('s1', 5.0, `
  <svg viewBox="0 0 ${W} ${H}">${bg('#CDEBFA', bgDots('#9BD3F0'))}
    <g filter="url(#boil)">
      <g id="s1q1"><text x="235" y="930" font-family="Luckiest Guy" font-size="150" fill="#fff" ${ink} stroke-width="10" paint-order="stroke">?</text></g>
      <g id="s1q2"><text x="790" y="860" font-family="Luckiest Guy" font-size="190" fill="#F2B33D" ${ink} stroke-width="10" paint-order="stroke">?</text></g>
      <g id="s1q3"><text x="850" y="1120" font-family="Luckiest Guy" font-size="120" fill="#fff" ${ink} stroke-width="10" paint-order="stroke">?</text></g>
      ${sitDogSVG('d1')}
    </g>
  </svg>
  <div class="txt toon" id="s1a" style="top:170px; font-size:112px">${words("Most dog problems")}</div>
  <div class="txt toon" id="s1b" style="top:420px; font-size:112px; color:#F2B33D">${words("aren’t training problems.")}</div>`,
  (t) => {
    const d = new SitDog('d1');
    const land = p(t, .15, .45);
    const drop = land < 1 ? -900 * (1 - easeInOut(land)) : 0;
    const sq = t > .6 && t < 1.0 ? 1 - Math.sin(p(t, .6, .4) * Math.PI) * .18 : 1;
    const tiltWave = t > 1.2 ? Math.sin((t - 1.2) * 2.6) * 14 : 0;
    d.set(t, { x: 220, y: 950 + drop, s: 1.6, sy: sq, sx: 2 - sq, tilt: tiltWave, brow: t > 1.2 ? 'confused' : 'normal', mouth: t > 1.2 ? 'smile' : 'open', ears: t > 1.2 ? -.2 : 0, wag: .4 });
    [['s1q1', 1.4, 290, 880], ['s1q2', 1.9, 860, 800], ['s1q3', 2.4, 890, 1080]].forEach(([id, s, x, y], i) =>
      popSvg(E(id), t, s, x, y, .45, `translate(0 ${(Math.sin(t * 4 + i) * 12).toFixed(1)})`));
    animWords(E('s1a'), t, .3, .12); animWords(E('s1b'), t, .9, .12);
  });

// S2 the real problems
scene('s2', 5.4, `
  <svg viewBox="0 0 ${W} ${H}">${bg('#FDE4B5', bgDots('#F6C876'))}
    <g filter="url(#boil)">
      <g id="b1"><rect x="50" y="620" width="310" height="300" rx="40" fill="#fff" ${ink}/>
        <rect x="125" y="680" width="150" height="80" rx="14" fill="none" ${ink}/><rect x="275" y="703" width="16" height="34" rx="4" fill="#1F2036"/><rect x="137" y="692" width="34" height="56" rx="6" fill="#F25C5C"/>
        <text x="205" y="860" text-anchor="middle" font-family="Luckiest Guy" font-size="44" fill="#1F2036">FULFILMENT</text></g>
      <g id="b2"><rect x="385" y="540" width="310" height="300" rx="40" fill="#fff" ${ink}/>
        <g transform="translate(540 680) scale(1.25)"><path d="M0,30 C-40,0 -60,-30 -35,-50 C-18,-62 -4,-52 0,-38 C4,-52 18,-62 35,-50 C60,-30 40,0 0,30 Z" fill="#F25C7A" ${ink}/><path d="M0,-38 L-8,-18 L6,-6 L-4,12 L0,30" fill="none" ${ink} stroke-width="6"/></g>
        <text x="540" y="790" text-anchor="middle" font-family="Luckiest Guy" font-size="44" fill="#1F2036">RELATIONSHIP</text></g>
      <g id="b3"><rect x="720" y="620" width="310" height="300" rx="40" fill="#fff" ${ink}/>
        <path d="M795,680 h160 a18,18 0 0 1 18,18 v58 a18,18 0 0 1 -18,18 h-100 l-34,28 v-28 h-26 a18,18 0 0 1 -18,-18 v-58 a18,18 0 0 1 18,-18z" fill="#CDEBFA" ${ink}/>
        <path d="M810,730 c20,-40 40,30 60,-10 s30,30 50,-10 s25,20 35,0" fill="none" ${ink} stroke-width="6"/>
        <text x="875" y="860" text-anchor="middle" font-family="Luckiest Guy" font-size="35" fill="#1F2036">COMMUNICATION</text></g>
      ${sitDogSVG('d2')}
    </g>
  </svg>
  <div class="txt toon" id="s2a" style="top:150px; font-size:92px">${words("They’re usually")}</div>
  <div class="txt toon" id="s2b" style="top:270px; font-size:92px; color:#F2B33D">${words("a missing piece:")}</div>
  <div class="txt body" id="s2c" style="top:1720px; font-size:58px">Usually all three at once.</div>`,
  (t) => {
    const d = new SitDog('d2');
    d.set(t, { x: 280, y: 1030, s: 1.3, brow: 'sad', mouth: 'frown', ears: -.6, wag: .1, tilt: Math.sin(t * 1.5) * 4 });
    popSvg(E('b1'), t, .9, 205, 770, .45, `rotate(-6 205 770) translate(0 ${(Math.sin(t * 3) * 8).toFixed(1)})`);
    popSvg(E('b2'), t, 1.4, 540, 690, .45, `translate(0 ${(Math.sin(t * 3 + 1) * 8).toFixed(1)})`);
    popSvg(E('b3'), t, 1.9, 875, 770, .45, `rotate(6 875 770) translate(0 ${(Math.sin(t * 3 + 2) * 8).toFixed(1)})`);
    animWords(E('s2a'), t, .2); animWords(E('s2b'), t, .45);
    slideUp(E('s2c'), t, 2.8);
  });

// S3 four blocks drop in
const BL = [['HEALTH', BLOCK_COL.health], ['LIFESTYLE', BLOCK_COL.lifestyle], ['CLARITY', BLOCK_COL.clarity], ['SKILLS', BLOCK_COL.skills]];
scene('s3', 6.2, `
  <svg viewBox="0 0 ${W} ${H}">${bg('#FBF4E6', bgDots('#EAD9B8'))}
    <g filter="url(#boil)" id="s3shake">
      <path d="M40,1745 C300,1735 700,1755 1040,1742" fill="none" ${ink}/>
      ${BL.map(([n, c], i) => `<g id="blk${i}"><rect x="90" y="${1580 - i * 165}" width="560" height="150" rx="26" fill="${c}" ${ink}/>
        <path d="M120,${1600 - i * 165} h60 M600,${1700 - i * 165} h24" ${ink} stroke="#fff" stroke-width="6" opacity=".6"/>
        <text x="370" y="${1678 - i * 165}" text-anchor="middle" font-family="Luckiest Guy" font-size="72" fill="#fff" ${ink} stroke-width="9" paint-order="stroke">${n}</text></g>`).join('')}
      ${sitDogSVG('d3')}
      ${star(740, 1080, 44, '#F2B33D', 's3st1')}${star(1000, 1180, 30, '#fff', 's3st2')}
    </g>
  </svg>
  <div class="txt toon" id="s3a" style="top:150px; font-size:96px">${words("So I don’t lead with obedience.")}</div>
  <div class="txt body" id="s3b" style="top:420px; font-size:56px">I build the four foundations underneath it. <span style="color:#2BA6DE">In order.</span></div>`,
  (t) => {
    let shake = 0;
    BL.forEach((_, i) => {
      const s = 1.5 + i * .55, k = p(t, s, .38);
      const y = k < 1 ? -1500 * Math.pow(1 - k, 2) : 0;
      E('blk' + i).setAttribute('transform', `translate(0 ${y.toFixed(1)})`);
      E('blk' + i).setAttribute('opacity', t >= s ? 1 : 0);
      const since = t - (s + .38);
      if (since > 0 && since < .22) shake = Math.max(shake, (1 - since / .22) * 14);
    });
    E('s3shake').setAttribute('transform', `translate(${(Math.sin(t * 90) * shake).toFixed(1)} ${(Math.cos(t * 70) * shake).toFixed(1)})`);
    const d = new SitDog('d3');
    const hop = BL.reduce((h, _, i) => { const q = p(t, 1.88 + i * .55, .3); return h + Math.sin(q * Math.PI) * 40; }, 0);
    const done = t > 4.0;
    d.set(t, { x: 650, y: 1255 - hop, s: 1.0, tilt: done ? -10 : -4, brow: done ? 'up' : 'normal', happy: done ? 1 : 0, ears: hop > 1 ? .5 : 0, wag: done ? 1.2 : .6 });
    popSvg(E('s3st1'), t, 4.1, 740, 1080, .45, `rotate(${t * 40} 740 1080)`);
    popSvg(E('s3st2'), t, 4.3, 1000, 1180, .45, `rotate(${-t * 50} 1000 1180)`);
    animWords(E('s3a'), t, .2, .09);
    slideUp(E('s3b'), t, .95);
  });

// Block scene template
function blockScene(id, n, name, color, bgc, dots, props, dogFn, head, body, extra = '') {
  scene(id, 5.4, `
    <svg viewBox="0 0 ${W} ${H}">${bg(bgc, bgDots(dots))}
      <g filter="url(#boil)">${props}</g>
    </svg>
    <div class="txt" id="${id}chip" style="top:120px"><span class="chip" style="background:${color}">BLOCK ${n}</span></div>
    <div class="txt toon" id="${id}t" style="top:230px; font-size:170px">${name}</div>
    <div class="card" id="${id}card" style="top:1500px"><h3>${head}</h3><p>${body}</p></div>${extra}`,
    (t) => {
      popEl(E(id + 'chip'), t, .25, .4, -8);
      popEl(E(id + 't'), t, .4, .5, 10);
      E(id + 't').style.color = '#fff';
      slideUp(E(id + 'card'), t, 1.3, .55, 120);
      dogFn(t);
    }, color);
}

// S4 Health: eating then heart
blockScene('s4', 1, 'HEALTH', BLOCK_COL.health, '#C9E8F8', '#9BD3F0', `
  ${sitDogSVG('d4')}
  <g id="bowl"><path d="M330,1400 L750,1400 L700,1490 L380,1490 Z" fill="#2BA6DE" ${ink}/><ellipse cx="540" cy="1400" rx="210" ry="30" fill="#8B5A2B" ${ink}/>
    <circle cx="470" cy="1388" r="16" fill="#B87333" ${ink} stroke-width="4"/><circle cx="520" cy="1380" r="16" fill="#B87333" ${ink} stroke-width="4"/><circle cx="580" cy="1386" r="16" fill="#B87333" ${ink} stroke-width="4"/>
    <text x="540" y="1470" text-anchor="middle" font-family="Luckiest Guy" font-size="50" fill="#fff">DOG</text></g>
  ${heart(540, 700, 1.6, '#F25C7A', 'hHeart')}
  <g id="tag1"><rect x="40" y="880" width="260" height="96" rx="48" fill="#fff" ${ink}/><text x="170" y="945" text-anchor="middle" font-family="Luckiest Guy" font-size="40" fill="#1F2036">✓ FOOD</text></g>
  <g id="tag2"><rect x="790" y="820" width="250" height="96" rx="48" fill="#fff" ${ink}/><text x="915" y="885" text-anchor="middle" font-family="Luckiest Guy" font-size="40" fill="#1F2036">✓ REST</text></g>
  <g id="tag3"><rect x="780" y="1080" width="270" height="96" rx="48" fill="#fff" ${ink}/><text x="915" y="1145" text-anchor="middle" font-family="Luckiest Guy" font-size="38" fill="#1F2036">✓ NO PAIN</text></g>`,
  (t) => {
    const eating = t > .9 && t < 2.5;
    const munch = eating ? 70 + Math.abs(Math.sin(t * 12)) * 14 : 0;
    const d = new SitDog('d4');
    d.set(t, { x: 300, y: 830, s: 1.2, headY: munch, happy: eating || t > 2.6 ? 1 : 0, mouth: eating ? 'smile' : 'open', brow: t > 2.6 ? 'up' : 'normal', wag: eating ? 1.3 : 1, ears: t > 2.6 ? .3 : 0 });
    popSvg(E('hHeart'), t, 2.65, 540, 700, .5, `translate(0 ${(Math.sin(t * 5) * 10).toFixed(1)})`);
    popSvg(E('tag1'), t, 1.1, 170, 928); popSvg(E('tag2'), t, 1.6, 915, 868); popSvg(E('tag3'), t, 2.1, 915, 1128);
  },
  'Feels good in their body.', 'A dog in pain can’t learn. So I never train over it.');

// S5 Lifestyle: running after ball
blockScene('s5', 2, 'LIFESTYLE', BLOCK_COL.lifestyle, '#FDE0A8', '#F6C876', `
  <g id="s5scroll">
    ${[0, 1, 2, 3].map(i => `<g transform="translate(${i * 700} 0)"><path d="M120,1180 C100,1060 170,960 260,980 C350,960 400,1080 360,1180 Z" fill="#7BC47F" ${ink}/><rect x="228" y="1170" width="40" height="120" fill="#A0703F" ${ink}/>
      <path d="M520,1290 l14,-30 l14,30 M560,1290 l12,-24 l12,24" fill="none" ${ink} stroke-width="5"/></g>`).join('')}
  </g>
  <path d="M-20,1300 C300,1290 700,1310 1100,1296" fill="none" ${ink}/>
  <g id="speed"><path d="M40,1000 h140 M20,1080 h180 M60,1160 h120" fill="none" ${ink} stroke-width="8"/></g>
  ${sideDogSVG('d5')}
  <g id="ball"><circle cx="0" cy="0" r="44" fill="#C6E23A" ${ink}/><path d="M-40,-14 C-10,0 10,0 40,-14 M-40,14 C-10,0 10,0 40,14" fill="none" stroke="#fff" stroke-width="6"/></g>
  <g id="pow1"><path d="M760,700 l40,-50 l20,50 l60,-30 l-10,60 l60,20 l-60,30 l20,60 l-60,-20 l-30,50 l-20,-60 l-60,10 l30,-50 l-50,-40 z" fill="#fff" ${ink}/><text x="820" y="790" text-anchor="middle" font-family="Luckiest Guy" font-size="46" fill="#E8A33A" ${ink} stroke-width="3">CHASE!</text></g>
  <g id="pow2"><path d="M130,690 l40,-50 l20,50 l60,-30 l-10,60 l60,20 l-60,30 l20,60 l-60,-20 l-30,50 l-20,-60 l-60,10 l30,-50 l-50,-40 z" fill="#fff" ${ink}/><text x="190" y="780" text-anchor="middle" font-family="Luckiest Guy" font-size="46" fill="#E8A33A" ${ink} stroke-width="3">SNIFF!</text></g>
  <g id="pow3"><path d="M450,590 l40,-50 l20,50 l60,-30 l-10,60 l60,20 l-60,30 l20,60 l-60,-20 l-30,50 l-20,-60 l-60,10 l30,-50 l-50,-40 z" fill="#fff" ${ink}/><text x="510" y="680" text-anchor="middle" font-family="Luckiest Guy" font-size="50" fill="#E8A33A" ${ink} stroke-width="3">PLAY!</text></g>`,
  (t) => {
    E('s5scroll').setAttribute('transform', `translate(${(-(t * 520) % 700).toFixed(1)} 0)`);
    const d = new SideDog('d5');
    d.set(t, { x: 20 + Math.sin(t * 1.3) * 30, y: 915, s: 1.18, speed: 2.6, amp: 34, bounce: 18 });
    const bt = (t * 1.6) % 1;
    E('ball').setAttribute('transform', `translate(${900 + Math.sin(t * 1.3) * 20} ${1250 - Math.abs(Math.sin(bt * Math.PI)) * 260}) rotate(${t * 400})`);
    E('speed').setAttribute('opacity', .5 + .5 * Math.sin(t * 20));
    popSvg(E('pow1'), t, 1.0, 820, 760, .4, `rotate(-8 820 760)`); popSvg(E('pow2'), t, 1.6, 190, 750, .4, `rotate(8 190 750)`); popSvg(E('pow3'), t, 2.2, 510, 650, .4);
  },
  'Fulfilled in their mind.', 'Meet their natural drives and the restlessness drops away.');

// S6 Clarity: confused -> YES! -> lightbulb
blockScene('s6', 3, 'CLARITY', BLOCK_COL.clarity, '#DCD8F7', '#B9B1EE', `

// ---------- Timeline ----------
const REVEAL = 0.45;
let acc = 0;
scenes.forEach((s, i) => { s.start = i === 0 ? 0 : acc - REVEAL; acc = s.start + s.dur; });
scenes.forEach((s, i) => s.end = i < scenes.length - 1 ? scenes[i + 1].start + REVEAL : s.start + s.dur);
const DURATION = scenes[scenes.length - 1].end;

function seek(t) {
  const seed = Math.floor(t * 8) % 6 + 1;
  E('boilNoise').setAttribute('seed', seed);
  E('boilNoiseT').setAttribute('seed', seed);
  scenes.forEach((s, i) => {
    const on = t >= s.start && t < s.end || (i === scenes.length - 1 && t >= s.start);
    s.el.style.display = on ? 'block' : 'none';
    if (!on) return;
    const k = i === 0 ? 1 : easeInOut(p(t, s.start, REVEAL));
    s.el.style.clipPath = k >= 1 ? 'none' : `circle(${(k * 1150).toFixed(1)}px at 540px 1000px)`;
    s.el.style.zIndex = i;
    s.update(t - s.start);
  });
}
window.DURATION = DURATION; window.FPS = 30; window.seek = seek;
window.setBlockImgsReady = Promise.resolve();
if (!location.search.includes('render')) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else seek(0);
